<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscaminas Pro - Alba & Juan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #1a1a2e; --card: #16213e; --accent: #4ecca3; --danger: #e94560; }
        * { box-sizing: border-box; }
        body {
            background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px;
            min-height: 100vh; overflow-x: hidden;
        }
        h2 { margin: 10px 0 8px; text-align: center; }
        #game-wrapper {
            width: min(100vw - 20px, 720px);
            display: flex; flex-direction: column; align-items: center;
        }
        #status-overlay {
            display: none; position: fixed; inset: 0; background: rgba(26, 26, 46, 0.95); z-index: 1000;
            flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; border: 3px solid var(--accent); width: min(80vw, 300px); }
        .difficulty-selector { margin-bottom: 10px; display: flex; gap: 5px; width: 100%; }
        .btn-diff { flex: 1; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; background: #333; color: white; font-size: 0.8rem; }
        .diff-active { background: #f39c12 !important; }
        .mode-selector { margin: 12px 0 15px; display: flex; gap: 10px; width: 100%; }
        .btn-mode { flex: 1; padding: 14px; border-radius: 10px; border: none; font-weight: bold; background: #555; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .active-mode { background: var(--accent); color: var(--bg); border: 2px solid white; }
        #grid {
            display: grid; gap: 2px; background: #0f3460; padding: 5px; border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 100%;
            max-width: calc(100vw - 20px);
            overflow: hidden;
            touch-action: manipulation;
        }
        .cell {
            aspect-ratio: 1 / 1;
            width: 100%;
            min-width: 0;
            background: #2a2a40; border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: clamp(0.7rem, 2.2vw, 1rem);
            cursor: pointer; user-select: none; line-height: 1;
        }
        .revealed { background: #e0e0e0; color: #1a1a2e; }
        .mine { background: var(--danger) !important; color: white !important; }
        .n-1 { color: blue; } .n-2 { color: green; } .n-3 { color: red; } .n-4 { color: darkblue; }
        .btn-menu { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        @media (max-width: 480px) {
            body { padding: 6px; }
            h2 { font-size: 1.2rem; }
            .difficulty-selector, .mode-selector { gap: 6px; }
            .btn-diff { padding: 7px 6px; font-size: 0.72rem; }
            .btn-mode { padding: 11px 8px; font-size: 0.9rem; }
            #grid { gap: 1px; padding: 4px; }
            .cell { border-radius: 2px; }
        }
    </style>
</head>
<body>
    <div id="status-overlay">
        <div class="modal-box" id="modal-box">
            <i id="status-icon" class="fas fa-skull" style="font-size: 3rem; margin-bottom: 15px;"></i>
            <h2 id="status-title">GAME OVER</h2>
            <button class="btn-menu" style="background: var(--accent);" onclick="initGame()">REINTENTAR</button>
            <button class="btn-menu" style="background: var(--danger); color: white;" onclick="window.location.href='index.html'">SALIR</button>
        </div>
    </div>

    <div id="game-wrapper">
        <h2>💣 BUSCAMINAS</h2>
        <div class="difficulty-selector">
            <button class="btn-diff diff-active" onclick="changeDiff(8, 8, 10, this)">BAJO</button>
            <button class="btn-diff" onclick="changeDiff(12, 12, 25, this)">MEDIO</button>
            <button class="btn-diff" onclick="changeDiff(15, 15, 45, this)">ALTO</button>
        </div>
        <div class="mode-selector">
            <button id="btnPicar" class="btn-mode active-mode" onclick="setMode('picar')"><i class="fas fa-hammer"></i> PICAR</button>
            <button id="btnBandera" class="btn-mode" onclick="setMode('bandera')"><i class="fas fa-flag"></i> BANDERA</button>
        </div>
        <div id="grid"></div>
    </div>

    <script>
        let mode = 'picar';
        let config = { rows: 8, cols: 8, mines: 10 };
        let board = [];
        let cells = [];
        let gameOver = false;
        let revealedCount = 0;

        function setMode(m) {
            mode = m;
            document.getElementById('btnPicar').classList.toggle('active-mode', m==='picar');
            document.getElementById('btnBandera').classList.toggle('active-mode', m==='bandera');
        }

        function changeDiff(r, c, m, btn) {
            config = { rows: r, cols: c, mines: m };
            document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('diff-active'));
            btn.classList.add('diff-active');
            initGame();
        }

        function fitGrid() {
            const grid = document.getElementById('grid');
            const availableWidth = Math.min(window.innerWidth - 20, 720);
            const gap = 2;
            const pad = 10;
            const cellSize = Math.floor((availableWidth - pad - ((config.cols - 1) * gap)) / config.cols);
            grid.style.gridTemplateColumns = `repeat(${config.cols}, ${cellSize}px)`;
            grid.style.width = `${config.cols * cellSize + (config.cols - 1) * gap + pad}px`;
            grid.style.maxWidth = 'calc(100vw - 20px)';
        }

        function initGame() {
            gameOver = false;
            revealedCount = 0;
            document.getElementById('status-overlay').style.display = 'none';
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';
            fitGrid();
            board = Array.from({ length: config.rows }, () => Array(config.cols).fill(0));
            cells = [];

            let placedMines = 0;
            while(placedMines < config.mines) {
                let r = Math.floor(Math.random() * config.rows);
                let c = Math.floor(Math.random() * config.cols);
                if(board[r][c] !== 'M') { board[r][c] = 'M'; placedMines++; }
            }

            for(let r=0; r<config.rows; r++) {
                for(let c=0; c<config.cols; c++) {
                    if(board[r][c] === 'M') continue;
                    let count = 0;
                    for(let i=-1; i<=1; i++) {
                        for(let j=-1; j<=1; j++) {
                            if(board[r+i]?.[c+j] === 'M') count++;
                        }
                    }
                    board[r][c] = count;
                }
            }

            for(let r=0; r<config.rows; r++) {
                cells[r] = [];
                for(let c=0; c<config.cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.onclick = () => handleCellClick(r, c);
                    gridElement.appendChild(cell);
                    cells[r][c] = cell;
                }
            }
        }

        function handleCellClick(r, c) {
            if(gameOver) return;
            const cell = cells[r][c];
            if(mode === 'bandera') {
                if(cell.classList.contains('revealed')) return;
                cell.innerText = cell.innerText === '🚩' ? '' : '🚩';
                return;
            }
            if(cell.innerText === '🚩' || cell.classList.contains('revealed')) return;
            if(board[r][c] === 'M') { revealAllMines(); showEnd(false); }
            else { revealCell(r, c); checkWin(); }
        }

        function revealCell(r, c) {
            if(r<0 || r>=config.rows || c<0 || c>=config.cols) return;
            if(cells[r][c].classList.contains('revealed')) return;
            const val = board[r][c];
            cells[r][c].classList.add('revealed');
            revealedCount++;
            if(val > 0) {
                cells[r][c].innerText = val;
                cells[r][c].classList.add('n-' + val);
            } else {
                for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) revealCell(r+i, c+j);
            }
        }

        function revealAllMines() {
            gameOver = true;
            for(let r=0; r<config.rows; r++) {
                for(let c=0; c<config.cols; c++) {
                    if(board[r][c] === 'M') {
                        cells[r][c].classList.add('mine');
                        cells[r][c].innerHTML = '<i class="fas fa-bomb"></i>';
                    }
                }
            }
        }

        function checkWin() {
            if(revealedCount === (config.rows * config.cols) - config.mines) showEnd(true);
        }

        function showEnd(win) {
            gameOver = true;
            const overlay = document.getElementById('status-overlay');
            const title = document.getElementById('status-title');
            const icon = document.getElementById('status-icon');
            overlay.style.display = 'flex';
            if(win) { title.innerText = '¡LIMPIEZA TOTAL!'; icon.className = 'fas fa-trophy'; icon.style.color = 'var(--accent)'; }
            else { title.innerText = 'BOOOOM!'; icon.className = 'fas fa-bomb'; icon.style.color = 'var(--danger)'; }
        }

        window.addEventListener('resize', () => { fitGrid(); });
        initGame();
    </script>
</body>
</html>
