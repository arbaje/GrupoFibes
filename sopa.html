<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sopa de Letras Pro</title>
    <style>
        :root { 
            --bg: #0f172a; 
            --card: #1e293b; 
            --accent: #10b981; 
            --danger: #ef4444; 
            --text: #f8fafc;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-wrapper { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            background: var(--card); 
            padding: 15px; 
            border-radius: 20px; 
            width: 95%;
            max-width: 900px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* Cambia a fila en pantallas grandes (PC) */
        @media (min-width: 768px) {
            .main-wrapper { flex-direction: row; padding: 30px; }
            .sidebar { width: 300px; }
        }

        #board { 
            display: grid; 
            gap: 4px; 
            background: #334155; 
            padding: 8px; 
            border-radius: 12px; 
            user-select: none;
            margin: 0 auto;
        }

        .letter { 
            width: clamp(25px, 8vw, 35px); 
            height: clamp(25px, 8vw, 35px); 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: clamp(0.7rem, 4vw, 1rem);
            transition: all 0.2s;
        }

        .letter.selected { background: #f59e0b; transform: scale(0.9); }
        .letter.found { background: var(--accent) !important; color: white; }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }
        
        .info-box { 
            background: #334155; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
        }

        .word-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); 
            gap: 8px; 
            margin-top: 10px;
        }

        .word-item { font-size: 0.8rem; padding: 4px; border-radius: 4px; background: rgba(0,0,0,0.2); }
        .word-item.found-word { color: #94a3b8; text-decoration: line-through; opacity: 0.6; }

        .ranking-box { 
            background: #334155; 
            padding: 15px; 
            border-radius: 12px; 
            max-height: 120px; 
            overflow-y: auto; 
        }

        .ranking-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid #475569; }

        .btn { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .btn-next { background: var(--accent); color: white; }
        .btn-exit { background: var(--danger); color: white; text-decoration: none; text-align: center; }
        .btn:active { opacity: 0.8; }

    </style>
</head>
<body>

    <div class="main-wrapper">
        <div style="flex-grow: 1;">
            <h2 id="levelTitle" style="margin:0 0 15px 0; color: var(--accent); text-align: center;">NIVEL 1</h2>
            <div id="board"></div>
        </div>

        <div class="sidebar">
            <div class="info-box">
                <div id="progresoText" style="font-size: 1rem; margin-bottom: 8px;"></div>
                <div style="font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px;">PALABRAS RESTANTES</div>
                <div id="wordsToFind" class="word-list"></div>
            </div>

            <div class="ranking-box">
                <h3 style="text-align:center; margin:0 0 8px 0; font-size: 0.9rem;">TOP PUNTOS</h3>
                <div id="rankingList"></div>
            </div>

            <button id="nextBtn" class="btn btn-next" style="display:none;" onclick="nextLevel()">¡Nivel Completado! Próximo</button>
            <a href="index.html" class="btn btn-exit">Salir al Menú</a>
        </div>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser') || 'Invitado';
        const diccionario = ["CASA", "PERRO", "GATO", "SOL", "LUNA", "MAR", "NUBE", "ARBOL", "FLOR", "QUESO", "PIZZA", "COCHE", "AVION", "LIBRO", "MESA", "SILLA", "RADIO", "TELE", "AGUA", "FUEGO", "TIERRA", "VIENTO", "MONTAÑA", "RIO", "PLAYA", "CIUDAD", "PUEBLO", "FRUTA", "MANZANA", "PLATANO", "VALOR", "CORAJE", "SUERTE", "MUSICA", "PIANO", "GUITARRA", "VERDE", "AZUL", "ROJO", "AMIGO", "FAMILIA", "NIÑO"];

        let userProgress = JSON.parse(localStorage.getItem('sopa_progreso_usuarios')) || {};
        let currentLevel = userProgress[currentUser] || 1;
        let wordsInLevel = [];
        let foundWords = [];

        function initLevel() {
            const board = document.getElementById("board");
            const wordContainer = document.getElementById("wordsToFind");
            const title = document.getElementById("levelTitle");
            
            // Dificultad: el tablero crece según el nivel
            let size = 8 + Math.floor(currentLevel / 5);
            if (size > 12) size = 12; // Máximo para que quepa bien en móviles

            board.innerHTML = "";
            wordContainer.innerHTML = "";
            foundWords = [];
            document.getElementById("nextBtn").style.display = "none";
            
            title.innerText = `NIVEL ${currentLevel}`;
            document.getElementById("progresoText").innerText = currentUser;
            board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

            // Selección de palabras
            let numWords = 3 + Math.floor(currentLevel / 8);
            wordsInLevel = [...diccionario].sort(() => 0.5 - Math.random()).slice(0, Math.min(numWords, 8));

            let grid = Array(size).fill().map(() => Array(size).fill(''));

            wordsInLevel.forEach(word => {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 50) {
                    let dir = Math.floor(Math.random() * 3); // 0:Horiz, 1:Vert, 2:Diag
                    let r = Math.floor(Math.random() * size);
                    let c = Math.floor(Math.random() * size);

                    if (canPlace(grid, word, r, c, dir, size)) {
                        for (let i = 0; i < word.length; i++) {
                            let currR = (dir === 1 || dir === 2) ? r + i : r;
                            let currC = (dir === 0 || dir === 2) ? c + i : c;
                            grid[currR][currC] = { char: word[i], word: word };
                        }
                        placed = true;
                    }
                    attempts++;
                }
                wordContainer.innerHTML += `<div id="word-${word}" class="word-item">${word}</div>`;
            });

            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const data = grid[r][c];
                    const div = document.createElement("div");
                    div.className = "letter";
                    div.innerText = data ? data.char : abc[Math.floor(Math.random() * abc.length)];
                    if (data) div.dataset.word = data.word;

                    div.onclick = function() {
                        if (this.classList.contains('found')) return;
                        this.classList.toggle('selected');
                        checkFound();
                    };
                    board.appendChild(div);
                }
            }
        }

        function canPlace(grid, word, r, c, dir, size) {
            for (let i = 0; i < word.length; i++) {
                let currR = (dir === 1 || dir === 2) ? r + i : r;
                let currC = (dir === 0 || dir === 2) ? c + i : c;
                if (currR >= size || currC >= size || (grid[currR][currC] !== '' && grid[currR][currC].char !== word[i])) {
                    return false;
                }
            }
            return true;
        }

        function checkFound() {
            wordsInLevel.forEach(word => {
                if (foundWords.includes(word)) return;
                const sel = document.querySelectorAll(`.letter.selected[data-word="${word}"]`);
                if (sel.length === word.length) {
                    sel.forEach(c => { 
                        c.classList.remove('selected'); 
                        c.classList.add('found'); 
                    });
                    document.getElementById(`word-${word}`).classList.add('found-word');
                    foundWords.push(word);
                }
            });

            if (foundWords.length === wordsInLevel.length) {
                saveScore(100); 
                document.getElementById("nextBtn").style.display = "block";
            }
        }

        function nextLevel() {
            currentLevel++;
            userProgress[currentUser] = currentLevel;
            localStorage.setItem('sopa_progreso_usuarios', JSON.stringify(userProgress));
            initLevel();
        }

        function saveScore(p) {
            let ranking = JSON.parse(localStorage.getItem('sopa_ranking_global')) || [];
            const idx = ranking.findIndex(r => r.name.toLowerCase() === currentUser.toLowerCase());
            if (idx !== -1) ranking[idx].points += p;
            else ranking.push({ name: currentUser, points: p });
            ranking.sort((a, b) => b.points - a.points);
            localStorage.setItem('sopa_ranking_global', JSON.stringify(ranking.slice(0, 5)));
            displayRanking();
        }

        function displayRanking() {
            let rk = JSON.parse(localStorage.getItem('sopa_ranking_global')) || [];
            document.getElementById("rankingList").innerHTML = rk.map((r, i) => `
                <div class="ranking-item" style="${r.name === currentUser ? 'color:#10b981; font-weight:bold' : ''}">
                    <span>${i + 1}. ${r.name}</span><span>${r.points} pts</span>
                </div>`).join('');
        }

        initLevel(); 
        displayRanking();
    </script>
</body>
</html>
