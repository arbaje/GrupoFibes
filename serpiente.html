<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serpiente Pro - Alba & Juan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #1a1a2e; --card: #16213e; --accent: #4ecca3; --danger: #e94560; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        
        /* PANTALLAS (INICIO Y GAME OVER) */
        #startScreen, #gameOverScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 46, 0.98); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #gameOverScreen { display: none; } /* Oculto al empezar */

        .config-box { background: var(--card); padding: 30px; border-radius: 20px; border: 2px solid var(--accent); text-align: center; width: 85%; max-width: 350px; }
        .speed-options { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        
        .btn-speed, .btn-restart { 
            padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; 
            background: #0f3460; color: white; transition: 0.3s; width: 100%;
        }
        .btn-speed:hover { background: var(--accent); color: var(--bg); }
        .btn-speed.active { background: var(--accent); color: var(--bg); box-shadow: 0 0 15px var(--accent); }
        
        .btn-main { background: var(--accent) !important; color: var(--bg) !important; font-size: 1.2rem; margin-top: 10px; }

        /* JUEGO */
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; padding: 15px; box-sizing: border-box; }
        canvas { background: #0f3460; border: 4px solid var(--card); border-radius: 15px; max-width: 95vw; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .btn-dir { width: 65px; height: 65px; background: var(--card); border: 2px solid var(--accent); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; touch-action: manipulation; }

        .ranking { margin-top: 15px; background: var(--card); padding: 15px; border-radius: 15px; width: 90%; max-width: 350px; margin-bottom: 20px; }
        .rank-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1f2d50; }
        .btn-exit { margin: 20px; padding: 12px 25px; background: var(--danger); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="startScreen">
        <div class="config-box">
            <i class="fas fa-staff-snake" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
            <h2>NUEVA PARTIDA</h2>
            <p>Elige tu velocidad:</p>
            <div class="speed-options">
                <button class="btn-speed" onclick="selectSpeed(180, this)">LENTO 🐢</button>
                <button class="btn-speed active" onclick="selectSpeed(100, this)">MEDIO 🐍</button>
                <button class="btn-speed" onclick="selectSpeed(50, this)">RÁPIDO ⚡</button>
            </div>
            <button class="btn-speed btn-main" onclick="startGame()">¡INICIAR!</button>
        </div>
    </div>

    <div id="gameOverScreen">
        <div class="config-box" style="border-color: var(--danger);">
            <i class="fas fa-skull-crossbones" style="font-size: 3rem; color: var(--danger); margin-bottom: 15px;"></i>
            <h2 style="color: var(--danger);">¡HAS PERDIDO!</h2>
            <p id="finalScoreText" style="font-size: 1.2rem; margin: 10px 0;">Puntuación: 0</p>
            <button class="btn-restart btn-main" onclick="resetGame()">REINTENTAR</button>
            <a href="index.html" class="btn-restart" style="display: block; text-decoration: none; margin-top: 10px; line-height: 20px;">SALIR</a>
        </div>
    </div>

    <div class="header">
        <div style="background: var(--card); padding: 5px 15px; border-radius: 10px;">PUNTOS: <span id="score" style="color:var(--accent); font-weight:bold;">0</span></div>
        <div id="userTag" style="color: var(--accent); font-weight: bold;"></div>
    </div>

    <canvas id="snakeGame" width="400" height="400"></canvas>

    <div class="controls">
        <div style="grid-column: 2" class="btn-dir" onclick="setDir('UP')"><i class="fas fa-chevron-up"></i></div>
        <div style="grid-column: 1" class="btn-dir" onclick="setDir('LEFT')"><i class="fas fa-chevron-left"></i></div>
        <div style="grid-column: 2" class="btn-dir" onclick="setDir('DOWN')"><i class="fas fa-chevron-down"></i></div>
        <div style="grid-column: 3" class="btn-dir" onclick="setDir('RIGHT')"><i class="fas fa-chevron-right"></i></div>
    </div>

    <div class="ranking">
        <div style="text-align: center; font-weight: bold; margin-bottom: 10px; color: var(--accent);">🏆 TOP 5 SCORES</div>
        <div id="rankingList"></div>
    </div>

    <a href="index.html" class="btn-exit">VOLVER AL MENÚ</a>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const box = 20;
        const currentUser = localStorage.getItem('currentUser') || 'Invitado';
        document.getElementById('userTag').innerText = currentUser;

        let score = 0;
        let d = "RIGHT";
        let snake = [];
        let food = {};
        let gameSpeed = 100;
        let gameLoop;

        // Inicializar posiciones
        function resetVariables() {
            score = 0;
            d = "RIGHT";
            snake = [{x: 10 * box, y: 10 * box}, {x: 9 * box, y: 10 * box}];
            food = { x: Math.floor(Math.random()*19)*box, y: Math.floor(Math.random()*19)*box };
            document.getElementById("score").innerText = "0";
        }

        function selectSpeed(ms, btn) {
            gameSpeed = ms;
            document.querySelectorAll('.btn-speed').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function startGame() {
            resetVariables();
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, gameSpeed);
        }

        function resetGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            startGame();
        }

        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            if(e.keyCode == 38 && d != "DOWN") d = "UP";
            if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });

        function setDir(dir) {
            if(dir == "LEFT" && d != "RIGHT") d = "LEFT";
            if(dir == "UP" && d != "DOWN") d = "UP";
            if(dir == "RIGHT" && d != "LEFT") d = "RIGHT";
            if(dir == "DOWN" && d != "UP") d = "DOWN";
        }

        function drawApple(x, y) {
            ctx.fillStyle = "#e94560";
            ctx.beginPath();
            ctx.arc(x + box/2, y + box/2, box/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#4ecca3";
            ctx.fillRect(x + box/2 - 1, y + 2, 2, 5);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? "#4ecca3" : "white";
                ctx.beginPath();
                // Usamos fillRect simple si roundRect falla en navegadores antiguos
                if (ctx.roundRect) {
                    ctx.roundRect(part.x, part.y, box-1, box-1, 5);
                } else {
                    ctx.rect(part.x, part.y, box-1, box-1);
                }
                ctx.fill();

                if (isHead) {
                    ctx.fillStyle = "black";
                    ctx.fillRect(part.x + 12, part.y + 4, 3, 3);
                    ctx.fillRect(part.x + 12, part.y + 12, 3, 3);
                    
                    ctx.strokeStyle = "red";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    if(d === "RIGHT") { ctx.moveTo(part.x+box, part.y+10); ctx.lineTo(part.x+box+8, part.y+10); }
                    else if(d === "LEFT") { ctx.moveTo(part.x, part.y+10); ctx.lineTo(part.x-8, part.y+10); }
                    else if(d === "UP") { ctx.moveTo(part.x+10, part.y); ctx.lineTo(part.x+10, part.y-8); }
                    else if(d === "DOWN") { ctx.moveTo(part.x+10, part.y+box); ctx.lineTo(part.x+10, part.y+box+8); }
                    ctx.stroke();
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawApple(food.x, food.y);
            drawSnake();

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                document.getElementById("score").innerText = score;
                food = { x: Math.floor(Math.random()*19)*box, y: Math.floor(Math.random()*19)*box };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(gameLoop);
                saveScore(score);
                showGameOver();
                return;
            }
            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i=0; i<array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function showGameOver() {
            document.getElementById('finalScoreText').innerText = "Puntuación: " + score;
            document.getElementById('gameOverScreen').style.display = 'flex';
            displayRanking();
        }

        function saveScore(s) {
            let ranking = JSON.parse(localStorage.getItem('snake_ranking')) || [];
            ranking.push({name: currentUser, points: s, date: new Date().toLocaleDateString()});
            ranking.sort((a,b) => b.points - a.points);
            localStorage.setItem('snake_ranking', JSON.stringify(ranking.slice(0,5)));
        }

        function displayRanking() {
            let ranking = JSON.parse(localStorage.getItem('snake_ranking')) || [];
            document.getElementById('rankingList').innerHTML = ranking.map((r, i) => `
                <div class="rank-item">
                    <span>${i+1}. ${r.name}</span>
                    <span style="color:var(--accent)">${r.points} pts</span>
                </div>
            `).join('');
        }
        
        displayRanking();
    </script>
</body>
</html>
